name: Publish NPM Package

run-name: Publish @encontact/baileys from ${{ github.ref_name }} with tag ${{ inputs.dist_tag }}

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'NPM dist-tag'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Check Linting
        run: yarn lint

      - name: Run Tests
        run: yarn test

      - name: Prepare Package Metadata
        run: |
          npm pkg set name='@encontact/baileys'
          npm pkg get name version

      - name: Validate Package Contents
        run: npm pack --dry-run

      - name: Verify NPM Authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Package
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
